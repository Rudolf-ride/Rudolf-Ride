name: Build Rudolf Driver Android

on:
  workflow_dispatch:

jobs:
  build-driver-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: rudolf-driver-android
        run: npm ci

      - name: Bundle mobile notifications
        working-directory: rudolf-driver-android
        run: npx --no-install esbuild src/mobile-push.js --bundle --format=iife --platform=browser --target=es2020 --outfile=www/mobile-push.js

      - name: Sync Android
        working-directory: rudolf-driver-android
        run: npx cap sync android

      - name: Prepare release keystore
        env:
          RUDOLF_KEYSTORE_B64: ${{ secrets.RUDOLF_DRIVER_KEYSTORE_BASE64 }}
        run: |
          test -n "$RUDOLF_KEYSTORE_B64"
          printf '%s' "$RUDOLF_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rudolf-driver-release.jks"
          test -s "$RUNNER_TEMP/rudolf-driver-release.jks"

      - name: Build APK
        working-directory: rudolf-driver-android/android
        env:
          RUDOLF_KEYSTORE_PATH: ${{ runner.temp }}/rudolf-driver-release.jks
          RUDOLF_KEYSTORE_PASSWORD: ${{ secrets.RUDOLF_DRIVER_STORE_PASSWORD }}
          RUDOLF_KEY_ALIAS: rudolf-driver
          RUDOLF_KEY_PASSWORD: ${{ secrets.RUDOLF_DRIVER_KEY_PASSWORD }}
        run: |
          test -n "$RUDOLF_KEYSTORE_PASSWORD"
          test -n "$RUDOLF_KEY_PASSWORD"
          ./gradlew assembleRelease

      - name: Verify signed APK
        run: |
          APK="rudolf-driver-android/android/app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"

          test -f "$APK"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED="ea7d36c9414067cf3e321f5fba559b6e897d1571538fb6a87382a1f84bc39dd5"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1 | tr '[:upper:]' '[:lower:]')"

          echo "Expected certificate SHA-256: $EXPECTED"
          echo "APK certificate SHA-256:      $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"
          echo "✅ APK SIGNATURE MATCHES FINAL RUDOLF DRIVER KEY"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Rudolf-Ride-Driver-APK
          path: rudolf-driver-android/android/app/build/outputs/apk/release/app-release.apk
