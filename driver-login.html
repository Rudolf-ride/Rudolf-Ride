<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Rudolf Ride - Driver Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 5px;
      text-align: center;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #driver-login-btn {
      background: #2563eb;
      color: white;
    }

    #driver-signup-btn {
      margin-top: 10px;
      background: #e5e7eb;
      color: #111827;
    }

    #driver-message {
      min-height: 22px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <h1>🚗 Rudolf Ride</h1>

    <p class="subtitle">
      Driver Account
    </p>

    <input
      id="driver-email"
      type="email"
      placeholder="Driver email"
      autocomplete="email"
    >

    <input
      id="driver-password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <label style="
      display:flex;
      align-items:center;
      gap:8px;
      margin:8px 2px 14px;
      font-size:14px;
      color:#4b5563;
      cursor:pointer;
    ">
      <input
        id="show-driver-password"
        type="checkbox"
        style="width:auto; margin:0;"
      >
      Show password
    </label>

    <button id="driver-login-btn">
      Sign In
    </button>

    <button
      id="driver-forgot-password-btn"
      type="button"
      style="
        background:transparent;
        color:#2563eb;
        border:none;
        box-shadow:none;
        padding:8px;
        margin:2px 0 8px;
        font-size:14px;
      "
    >
      Forgot Password?
    </button>

    <button id="driver-signup-btn">
      Create Driver Account
    </button>

    <p id="driver-message"></p>

  </div>

  <script
    type="module"
    src="driver-auth.js"
  ></script>

</body>
</html>

<script>
document
  .getElementById("show-driver-password")
  .addEventListener("change", function () {
    const password =
      document.getElementById("driver-password");

    password.type =
      this.checked ? "text" : "password";
  });
</script>

<style>
/* =========================
   DRIVER BUTTON TOUCH FEEDBACK
========================= */

/* Sign In + Create Account */
#driver-login-btn,
#driver-signup-btn {
  transition:
    transform 0.12s ease,
    filter 0.12s ease,
    box-shadow 0.12s ease;
}

#driver-login-btn:active,
#driver-signup-btn:active {
  transform: scale(0.97);
  filter: brightness(0.82);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15);
}

/* Show Password */
label:has(#show-driver-password) {
  padding: 7px 9px;
  border-radius: 9px;
  transition:
    background 0.15s ease,
    color 0.15s ease;
}

label:has(#show-driver-password:checked) {
  background: #dbeafe;
  color: #1d4ed8 !important;
  font-weight: 600;
}

#show-driver-password:checked {
  accent-color: #2563eb;
}
</style>
